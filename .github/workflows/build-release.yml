name: build-release

on:
  push:
    tags: ["**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64-linux:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: ubuntu-22.04
      target: x86_64-linux
      build_type: release
      use_allocator_shim: true

  build-x86_64-linux-debug:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: ubuntu-22.04
      target: x86_64-linux
      build_type: debug
      # TSan disables PartitionAlloc-as-malloc in V8.
      use_allocator_shim: false

  build-arm64-linux:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-linux
      build_type: release
      use_allocator_shim: true

  build-aarch64-macos:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: macos-26
      target: aarch64-macos
      build_type: release
      use_allocator_shim: true

  build-x86_64-macos:
    uses: ./.github/workflows/_prebuild-v8.yml
    with:
      runner: macos-26-intel
      target: x86_64-macos
      build_type: release
      use_allocator_shim: true
